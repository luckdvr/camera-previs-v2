<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera Previs</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111512;color:#e4e9df;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1140px;padding:24px;margin:auto}header{display:flex;gap:20px;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-weight:500;letter-spacing:2px;font-size:20px;margin:0}#title{color:#a9b5a3;font-size:12px}#screen{margin:auto;line-height:0;max-width:100%;background:#e9e8e3}#screen canvas{display:block;width:100%;height:100%}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}button,select,.file{background:#252e27;color:#e6ecdf;border:1px solid #414c42;border-radius:5px;font:inherit;padding:9px 12px;cursor:pointer}button:hover{background:#354437}button:disabled,input:disabled,select:disabled{opacity:.45;cursor:wait}#play{background:#dde5cd;color:#172016;min-width:70px}#seek{flex:1;min-width:160px;accent-color:#b7c5a0}#clock{font:12px ui-monospace,monospace}#shot{max-width:100%}details{border-top:1px solid #374135;padding-top:16px;margin-top:22px}summary{cursor:pointer;color:#b7c2af}.row{display:flex;align-items:center;gap:8px;margin:10px 0}.row span{width:100px;flex-shrink:0}.row input{min-width:0;width:25%;max-width:140px;background:#1b231d;color:#eef1e9;border:1px solid #465243;border-radius:3px;padding:8px}small{color:#95a48f;line-height:1.8}.file input{display:none}textarea{width:100%;height:180px;background:#1b231d;color:#c1ceba;border:1px solid #465243;padding:12px;font:12px/1.8 ui-monospace,monospace}#map{display:block;width:min(100%,640px);height:auto;touch-action:none;cursor:crosshair;margin:15px 0}#status{font-size:12px;color:#bdcfae;min-height:20px}#note{color:#9ba994;font-size:12px}#cancel{display:none}@media(max-width:650px){main{padding:16px 12px}h1{font-size:16px}header{display:block}#title{margin-top:8px}.bar{gap:7px}.row span{width:76px}}
</style></head><body><main><header><h1>CAMERA PREVIS</h1><span id="title"></span></header><div id="screen"></div>
<div class="bar"><button id="play">播放</button><input id="seek" type="range" min="0" value="0" step="0.01" aria-label="时间"><span id="clock"></span><select id="speed" aria-label="播放速度"><option value=".25">0.25×</option><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div>
<div class="bar"><select id="shot" aria-label="镜头"></select><button id="exportMP4">导出 MP4</button><button id="exportWebM">导出 WebM</button><button id="cancel">取消导出</button></div><div id="status"></div>
<details><summary>调整镜头与复用参数</summary><div class="bar"><label>关键点 <select id="key" aria-label="关键点"></select></label><button id="addKey">在当前时间加关键点</button><button id="undo">撤销</button><button id="redo">重做</button></div>
<small>坐标 X 左右、Y 高度、Z 前后；选中关键点后调整。红点可拖动，改变当前关键点的机位。</small><div id="fields"></div><div class="bar"><button id="apply">应用机位</button><span id="space"></span></div><canvas id="map" width="640" height="300"></canvas>
<div class="bar"><label>主体 <select id="object" aria-label="主体"></select></label></div><div id="objectFields"></div><button id="applyObject">应用主体位置</button><p id="note"></p>
<div class="bar"><button id="save">导出参数</button><label class="file">导入参数<input id="load" type="file" accept=".json"></label><button id="saveHTML">保存交互文件</button><button id="savePrompt">导出提示词</button></div><textarea id="prompt" readonly aria-label="同步提示词"></textarea><p><small>灰模用于确认景别、运镜与空间关系。动作是预设示意；画面和提示词由同一份参数生成，网页操作不调用模型。</small></p>
</details><details><summary>开源组件许可</summary><pre><!--LICENSE--></pre></details></main>
<script id="config" type="application/json"><!--CONFIG--></script><script><!--THREE--></script><script><!--TIMELINE--></script><script><!--MODEL--></script><script><!--PROXIES--></script><script><!--MP4--></script><script><!--ENGINE--></script></body></html>
