<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连续运镜预演</title>
<style>body{margin:0;background:#151918;color:#e9e8df;font:14px system-ui,"PingFang SC",sans-serif}main{max-width:1500px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(600px,960px) minmax(280px,1fr);gap:24px}h1{font-size:24px;font-weight:500;margin:0 0 10px}p{color:#abb1a8;line-height:1.6}canvas{width:100%;display:block}#screen{aspect-ratio:16/9}#diagram{aspect-ratio:48/29}.panel{background:#222925;border:1px solid #39413a;padding:16px;border-radius:10px;margin-bottom:12px}button,select,input,textarea{font:inherit;color:inherit;background:#303a34;border:1px solid #536052;border-radius:5px;padding:7px}button{cursor:pointer}button:disabled{opacity:.4;cursor:wait}input[type=range]{width:95%}input[type=number]{width:68px}label{display:inline-block;margin:7px 8px 7px 0}textarea{box-sizing:border-box;width:100%;font-size:12px;line-height:1.6}#status{color:#d4b88a;min-height:24px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}small{color:#b4beb2}.canvas-wrap{position:relative}.badge{position:absolute;left:16px;top:12px;background:#18201bba;padding:5px 9px;border-radius:4px}.handle{position:absolute;width:18px;height:18px;border:2px solid white;border-radius:50%;background:#ad4835;transform:translate(-50%,-50%);cursor:move;touch-action:none;padding:0}#diwrap{position:relative}details{margin-top:12px}summary{cursor:pointer;padding:8px}@media(max-width:1000px){main{display:block;padding:12px}aside{margin-top:20px}}</style>
<main><section><h1 id="title"></h1><p>连续运镜 · 简化空间与主体 · 依据成片反推的近似机位</p><div class="canvas-wrap"><canvas id="screen" width="960" height="540"></canvas><span class="badge">运镜预演</span></div><div id="diwrap"><canvas id="diagram" width="960" height="580"></canvas><button class="handle" id="handle" title="拖动当前关键点：改变地面平面位置"></button></div><div class="panel"><div class="row"><button id="play">播放</button><button id="rewind">回到开始</button><select id="speed"><option value="0.5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option></select><span id="clock"></span></div><input type="range" id="seek" min="0" max="20" step="0.01"><p id="status">拖时间查看，选择关键点后拖动红色圆点调整位置。</p></div></section>
<aside><div class="panel"><h2>关键位置</h2><label>轨迹 <select id="track"><option value="camera">摄影机</option><option value="look">注视点</option><option value="subject">主体</option></select></label><label>时间点 <select id="key"></select></label><div id="coords"></div><small id="space"></small><div class="row"><label>竖向视角 <input id="fov" type="number" min="15" max="100">°</label><button id="undo">撤销</button><button id="redo">重做</button></div></div><div class="panel"><h2>同步提示词</h2><textarea id="prompt" rows="15" readonly></textarea><button id="copy">复制提示词</button><button id="save-prompt">保存提示词</button></div><div class="panel"><h2>保存与复用</h2><div class="row"><button id="save-json">导出参数</button><button id="save-html">保存预演网页</button><button id="import">导入参数</button></div><input id="file" type="file" accept=".json" hidden><details><summary>完整参数</summary><textarea id="params" rows="12"></textarea><button id="apply">应用参数</button></details><p>原视频与原提示词保留在交付目录；本页只修改预演。</p><select id="area"><option value="view">纯预演</option><option value="diagram">动态机位图</option><option value="combined">预演与机位图</option></select><button id="export">导出视频</button><button id="cancel" hidden>取消导出</button></div></aside></main>
<script id="config" type="application/json"><!--CONFIG--></script><script><!--THREE--></script><script><!--TIMELINE--></script><script><!--VIDEO--></script><script><!--ENGINE--></script><details style="margin:24px"><summary>Three.js 许可证</summary><pre><!--LICENSE--></pre></details></html>
